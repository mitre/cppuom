name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-latest (coverage)
            os: ubuntu-latest
            build_type: Debug
            coverage: true
            cxx_flags: --coverage -O0 -g
            linker_flags: --coverage
          - name: macos-latest
            os: macos-latest
            build_type: Release
            coverage: false
            cxx_flags: ""
            linker_flags: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install CMake 4
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/cmake-venv"
          "$RUNNER_TEMP/cmake-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/cmake-venv/bin/python" -m pip install "cmake>=4.0,<5"
          if [[ "${{ matrix.coverage }}" == "true" ]]; then
            "$RUNNER_TEMP/cmake-venv/bin/python" -m pip install "gcovr>=8,<9"
          fi
          echo "$RUNNER_TEMP/cmake-venv/bin" >> "$GITHUB_PATH"

      - name: Configure
        run: >
          cmake -S . -B build
          -DBUILD_EXAMPLE=ON
          -DBUILD_TESTING=ON
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_CXX_FLAGS="${{ matrix.cxx_flags }}"
          -DCMAKE_EXE_LINKER_FLAGS="${{ matrix.linker_flags }}"

      - name: Build
        run: cmake --build build --parallel

      - name: Run test binary
        run: ./build/bin/cppuom-tests

      - name: Generate coverage report
        if: matrix.coverage
        shell: bash
        run: |
          mkdir -p coverage
          gcovr build/CMakeFiles/cppuom-tests.dir \
            --root . \
            --filter 'include/' \
            --print-summary \
            --txt coverage/coverage.txt \
            --xml-pretty --xml coverage/coverage.xml \
            --html-details coverage/coverage.html
          cat coverage/coverage.txt
          {
            echo "## Coverage"
            echo '```'
            cat coverage/coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: matrix.coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: coverage
          if-no-files-found: error

      - name: Run example
        run: ./build/bin/cppuom-example
