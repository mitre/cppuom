name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install CMake 4
        shell: bash
        run: |
          python3 -m pip install --user "cmake>=4.0,<5"
          echo "$(python3 -m site --user-base)/bin" >> "$GITHUB_PATH"

      - name: Configure
        run: cmake -S . -B build -DBUILD_EXAMPLE=ON -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Run example
        run: ./bin/cppuom-example

      - name: Run test binary
        run: ./bin/cppuom-tests
